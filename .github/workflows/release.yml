name: Release

# When a person merges the release pull request (next → main, titled "vA.B.C: ...", merged with a merge commit),
# this tags main with that version, builds the web game once with that version, publishes it to Firebase, writes the
# GitHub release from CHANGELOG.md's section for that version, renames the milestone "vX.Y.Z → next" to
# "vX.Y.Z → vA.B.C" and closes it, and opens "vA.B.C → next". next needs nothing afterwards: a merge commit keeps it
# an ancestor of main. Nobody types a version by hand outside the release pull request's title.
#
# Publishing uses Workload Identity Federation: GitHub proves who it is to Google on each run, so no key is stored.
# It needs the repository variables WIF_PROVIDER and WIF_SERVICE_ACCOUNT (set once; docs/guides/releasing.md).
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which release is this?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
          head=$(echo "$pr" | jq -r '.head.ref // ""'); title=$(echo "$pr" | jq -r '.title // ""')
          if [ "$head" != "next" ] || ! [[ "$title" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+):\ .+ ]]; then
            echo "::error::main moved without a release pull request from next ('$head', '$title'). Only the release pull request goes into main."
            exit 1
          fi
          v="${BASH_REMATCH[1]}"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then echo "::error::$v already exists."; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "title=${title#*: }" >> "$GITHUB_OUTPUT"

      - name: Tag main (pushed only once it is published)
        env:
          V: ${{ steps.version.outputs.version }}
          T: ${{ steps.version.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "$V: $T"

      - uses: ./.github/actions/godot

      - name: Build the web game with its version
        run: bash tools/dev/export-web.sh

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Publish to Firebase Hosting
        run: npx --yes firebase-tools@15 deploy --only hosting --project aklabs-dev --non-interactive -m "${{ steps.version.outputs.version }}"

      - name: Push the tag
        run: git push origin "${{ steps.version.outputs.version }}"

      - name: Write the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
          T: ${{ steps.version.outputs.title }}
        run: |
          set -euo pipefail
          { echo "$T"; echo; python3 tools/dev/release-notes.py --section "$V"; } > notes.md
          gh release create "$V" --title "$V: $T" --notes-file notes.md

      - name: Close the milestone and open the next one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          m=$(gh api "repos/$REPO/milestones?state=open" --jq '[.[] | select(.title | endswith("→ next"))][0]')
          num=$(echo "$m" | jq -r .number); base=$(echo "$m" | jq -r '.title | split(" → ")[0]')
          gh api -X PATCH "repos/$REPO/milestones/$num" -f title="$base → $V" -f state=closed >/dev/null
          gh api -X POST "repos/$REPO/milestones" -f title="$V → next" -f description="Built on $V. Its purpose and its version are decided by the team (AGENTS.md)." >/dev/null

